<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f3ead7">
	<link rel="stylesheet" href="/styles/styles.css">
	<title>White Rabbit Calendar</title>
</head>
<body>
	<div class="app">
		<aside class="sidebar" aria-label="Calendar navigation">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true"><img src="/styles/images/il_fullxfull.1418067569_fv1a.webp" alt=""></span>
				<span class="brand-copy"><strong>White Rabbit</strong><small>Calendar</small></span>
			</div>
			<button class="new-event" id="newEventButton" type="button"><span aria-hidden="true">＋</span> Create event</button>
			<p class="section-label">Quick date</p>
			<div class="mini-header"><span id="miniMonth"></span><div class="mini-controls"><button class="icon-button" id="miniPrev" aria-label="Previous month">‹</button><button class="icon-button" id="miniNext" aria-label="Next month">›</button></div></div>
			<div class="mini-weekdays" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
			<div class="mini-grid" id="miniGrid"></div>
			<figure class="sidebar-poster">
				<img src="/styles/images/teatime.jpg" alt="The White Rabbit emerging from a teacup, always late for tea">
				<figcaption>Save a little time for tea.</figcaption>
			</figure>
		</aside>

		<main>
			<header class="topbar">
				<div class="top-left">
					<button class="today-button" id="todayButton" type="button">Today</button>
					<div class="month-controls"><button class="icon-button" id="prevMonth" aria-label="Previous month">‹</button><button class="icon-button" id="nextMonth" aria-label="Next month">›</button><h1 class="month-title" id="monthTitle"></h1><span class="rabbit-motto">Don't be late for a very important date.</span></div>
				</div>
				<div class="top-actions">
					<button class="delete-all-events" id="deleteAllEventsButton" type="button" aria-label="Delete all events">Delete all</button>
					<button class="icon-button search-button" id="searchButton" aria-label="Search events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
					<select class="view-select" id="viewSelect" aria-label="Calendar view"><option value="month">Month</option><option value="week">Week</option></select>
					<div class="avatar" aria-label="User profile">JD</div>
				</div>
			</header>
			<section class="calendar-card" aria-label="Calendar">
				<div class="weekdays" aria-hidden="true"><div class="weekday">Sunday</div><div class="weekday">Monday</div><div class="weekday">Tuesday</div><div class="weekday">Wednesday</div><div class="weekday">Thursday</div><div class="weekday">Friday</div><div class="weekday">Saturday</div></div>
				<div class="month-grid" id="calendarGrid"></div>
			</section>
		</main>
	</div>

	<div class="modal-backdrop" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
		<form class="modal" id="eventForm">
			<h2 id="modalTitle">Create task</h2>
			<label class="form-field">Task name<input id="eventName" type="text" placeholder="e.g. Team catch-up" required maxlength="60"></label>
			<label class="form-field">Date<input id="eventDate" type="date" required></label>
			<label class="form-field">Estimated time to complete (minutes)<input id="eventDuration" type="number" min="1" max="1440" value="60" required></label>
			<label class="form-field">Priority
				<select id="eventPriority">
					<option value="mustDo">Must do</option>
					<option value="shouldDo">Should Do</option>
					<option value="couldDo">Could Do</option>
				</select>
			</label>
			<div class="modal-actions"><button class="cancel-button" id="cancelEvent" type="button">Cancel</button><button class="save-button" type="submit">Save event</button></div>
		</form>
	</div>

	<script>
		(() => {
			const today = new Date();
			const state = { year: today.getFullYear(), month: today.getMonth(), selected: new Date(today.getFullYear(), today.getMonth(), today.getDate()), view: 'month' };
			const defaultEvents = [
				{ date: dateKey(today.getFullYear(), today.getMonth(), 4), title: 'Focus time', color: 'purple', durationMinutes: 60, priority: 'mustDo' },
				{ date: dateKey(today.getFullYear(), today.getMonth(), 9), title: 'Design review', color: 'blue', durationMinutes: 60, priority: 'shouldDo' },
				{ date: dateKey(today.getFullYear(), today.getMonth(), 15), title: 'Project check-in', color: 'orange', durationMinutes: 60, priority: 'shouldDo' },
				{ date: dateKey(today.getFullYear(), today.getMonth(), 22), title: 'Coffee with Zach, Rob, Evan, and Ethan', color: 'purple', durationMinutes: 60, priority: 'couldDo' }
			];
			const storedEvents = localStorage.getItem('calendarEvents');
			const events = storedEvents === null ? defaultEvents : JSON.parse(storedEvents);
			if (storedEvents === null) {
				localStorage.setItem('calendarEvents', JSON.stringify(events));
			}
			const monthTitle = document.getElementById('monthTitle');
			const grid = document.getElementById('calendarGrid');
			const miniGrid = document.getElementById('miniGrid');
			const miniMonth = document.getElementById('miniMonth');
			const modal = document.getElementById('eventModal');
			const deleteAllEventsButton = document.getElementById('deleteAllEventsButton');

			function dateKey(year, month, day) {
				return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
			}
			function priorityClass(priority) {
				return ['mustDo', 'shouldDo', 'couldDo'].includes(priority) ? `priority-${priority}` : 'priority-unprioritized';
			}
			function saveEvents() {
				localStorage.setItem('calendarEvents', JSON.stringify(events));
			}
			function sameDate(a, b) {
				return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
			}
			function monthDate(year, month, day) { return new Date(year, month, day); }
			function render() {
				const first = monthDate(state.year, state.month, 1);
				monthTitle.textContent = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
				deleteAllEventsButton.disabled = events.length === 0;
				const weekStart = state.view === 'week' ? new Date(state.selected) : new Date(state.year, state.month, 1 - first.getDay());
				if (state.view === 'week') weekStart.setDate(weekStart.getDate() - weekStart.getDay());
				const count = state.view === 'week' ? 7 : 42;
				grid.innerHTML = '';
				for (let i = 0; i < count; i++) {
					const date = new Date(weekStart);
					date.setDate(weekStart.getDate() + i);
					const key = dateKey(date.getFullYear(), date.getMonth(), date.getDate());
					const cell = document.createElement('div');
					cell.className = `day-cell${date.getMonth() !== state.month && state.view === 'month' ? ' outside' : ''}${sameDate(date, today) ? ' is-today' : ''}`;
					cell.setAttribute('role', 'button');
					cell.setAttribute('tabindex', '0');
					cell.setAttribute('aria-label', date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }));
					const number = document.createElement('div');
					number.className = 'day-number';
					number.textContent = date.getDate();
					cell.appendChild(number);
					events.filter(calendarEvent => calendarEvent.date === key).forEach(calendarEvent => {
						const item = document.createElement('div');
						item.className = `event ${priorityClass(calendarEvent.priority)}`;
						item.title = calendarEvent.title;
						if (calendarEvent.completed) {
							item.title += ' (completed)';
							const completedMark = document.createElement('span');
							completedMark.className = 'event-completed-mark';
							completedMark.textContent = '✓';
							completedMark.setAttribute('role', 'img');
							completedMark.setAttribute('aria-label', 'Completed');
							item.appendChild(completedMark);
						}
						const eventTitle = document.createElement('span');
						eventTitle.className = 'event-title';
						eventTitle.textContent = calendarEvent.title;
						const deleteButton = document.createElement('button');
						deleteButton.type = 'button';
						deleteButton.className = 'delete-event';
						deleteButton.textContent = '×';
						deleteButton.setAttribute('aria-label', `Delete ${calendarEvent.title}`);
						deleteButton.addEventListener('click', clickEvent => {
							clickEvent.preventDefault();
							clickEvent.stopPropagation();
							const eventIndex = events.indexOf(calendarEvent);
							if (eventIndex === -1) return;
							events.splice(eventIndex, 1);
							saveEvents();
							render();
						});
						item.append(eventTitle, deleteButton);
						cell.appendChild(item);
					});
					cell.addEventListener('click', () => {
						window.location.href = `calenderDay.html?date=${key}`;
					});
					cell.addEventListener('keydown', event => {
						if (event.target !== cell) return;
						if (event.key === 'Enter' || event.key === ' ') {
							event.preventDefault();
							cell.click();
						}
					});
					grid.appendChild(cell);
				}
				renderMini();
			}
			function renderMini() {
				const first = monthDate(state.year, state.month, 1);
				miniMonth.textContent = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
				miniGrid.innerHTML = '';
				for (let i = 0; i < 42; i++) {
					const date = monthDate(state.year, state.month, 1 - first.getDay() + i);
					const button = document.createElement('button');
					button.type = 'button';
					button.className = `mini-day${date.getMonth() !== state.month ? ' outside' : ''}${sameDate(date, today) ? ' today' : ''}${sameDate(date, state.selected) ? ' selected' : ''}`;
					button.textContent = date.getDate();
					button.setAttribute('aria-label', date.toLocaleDateString());
					button.addEventListener('click', () => {
						const key = dateKey(date.getFullYear(), date.getMonth(), date.getDate());
						window.location.href = `calenderDay.html?date=${key}`;
					});
					miniGrid.appendChild(button);
				}
			}
			function shiftMonth(amount) {
				const date = monthDate(state.year, state.month + amount, 1);
				state.year = date.getFullYear(); state.month = date.getMonth(); render();
			}
			document.getElementById('prevMonth').addEventListener('click', () => shiftMonth(state.view === 'week' ? -1 : -1));
			document.getElementById('nextMonth').addEventListener('click', () => shiftMonth(1));
			document.getElementById('miniPrev').addEventListener('click', () => shiftMonth(-1));
			document.getElementById('miniNext').addEventListener('click', () => shiftMonth(1));
			document.getElementById('todayButton').addEventListener('click', () => { state.year = today.getFullYear(); state.month = today.getMonth(); state.selected = new Date(today); render(); });
			document.getElementById('viewSelect').addEventListener('change', event => { state.view = event.target.value; render(); });
			function openModal(date = state.selected) {
				document.getElementById('eventDate').value = dateKey(date.getFullYear(), date.getMonth(), date.getDate());
				modal.classList.add('open');
				document.getElementById('eventName').focus();
			}
			document.getElementById('newEventButton').addEventListener('click', () => openModal());
			deleteAllEventsButton.addEventListener('click', () => {
				if (events.length === 0 ||
					!window.confirm('Delete all events? This cannot be undone.')) {
					return;
				}
				events.length = 0;
				saveEvents();
				render();
			});
			document.getElementById('cancelEvent').addEventListener('click', () => modal.classList.remove('open'));
			modal.addEventListener('click', event => { if (event.target === modal) modal.classList.remove('open'); });
			document.getElementById('eventForm').addEventListener('submit', event => {
				event.preventDefault();
				const name = document.getElementById('eventName').value.trim();
				if (!name) return;
				events.push({
					date: document.getElementById('eventDate').value,
					title: name,
					durationMinutes: Number(document.getElementById('eventDuration').value),
					priority: document.getElementById('eventPriority').value
				});
				saveEvents();
				modal.classList.remove('open');
				event.target.reset();
				render();
			});
			document.getElementById('searchButton').addEventListener('click', () => {
				const query = window.prompt('Search events');
				if (query === null) return;
				const match = events.find(item => item.title.toLowerCase().includes(query.trim().toLowerCase()));
				if (match) {
					const [year, month, day] = match.date.split('-').map(Number);
					state.year = year; state.month = month - 1; state.selected = monthDate(year, month - 1, day); render();
				} else if (query.trim()) window.alert('No matching events found.');
			});
			render();
		})();
	</script>
</body>
</html>
